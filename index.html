    case 'todoReset':if(arm('todoReset',t,'Biztosan nullázod?')){st.td={h:{}};saveTd();renderTodo();toast('A mai lista nullázva')}break;
    case 'goalDone':{
      st.gl.done=!st.gl.done;saveGl();
      const b=$('#goalBtn');b.classList.toggle('done',st.gl.done);
      $('#goalTxt').textContent=st.gl.done?'Ma nyomattam a BUNDLE akciókat!':'Nyomattam ma a BUNDLE akciókat';
      $('small',b).textContent=st.gl.done?'Szép munka, holnap is folytatjuk!':'Koppints, ha ma már ajánlottad a bundle csomagokat';
      if(st.gl.done){burst(ev.clientX,ev.clientY);confetti();haptic([12,40,24]);toast('Szép munka, a mai cél teljesítve!')}
      updateBadges();
      {const dd=$$('.gd.today');dd.forEach(x=>{x.classList.toggle('done',st.gl.done);x.textContent=st.gl.done?'✓':x.textContent})}
      break}
    case 'cnt':{
      const k=t.dataset.k,dir=+t.dataset.dir;st.gl[k]=Math.max(0,(st.gl[k]||0)+dir);saveGl();
      const b=$('[data-cnt="'+k+'"]');b.textContent=st.gl[k];b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');
      if(dir>0)burst(ev.clientX,ev.clientY);
      break}
    case 'repSend':repSend(t);break;
    case 'kpiBbox':kpiAdjust('bbox',t.dataset.n,+t.dataset.dir);break;
    case 'kpiTar':kpiAdjust('tartozek',t.dataset.n,+t.dataset.dir);break;
    case 'kpiAr':kpiAdjustAr(+t.dataset.dir);break;
    case 'tvpCat':st.tvp.cat=t.dataset.v;renderTvp();break;
    case 'tvpCalc':{
      const raw=($('#tvpPrice').value||'').replace(/[^\d]/g,'');
      if(!raw){toast('Add meg az árat.');break}
      st.tvp.price=raw;st.tvp.result=parseInt(raw,10);
      const r=$('#tvpResult');r.innerHTML=tvpResultHTML();countUps(r);after(r);
      const btn=t.getBoundingClientRect();burst(btn.left+btn.width/2,btn.top+btn.height/2);
      break}
    case 'openFile':$('#impFile').click();break;
    case 'impCur':{impText=toText(st.ym);$('#impText').value=impText;const [y,m]=parseYm(st.ym);$('#impY').value=y;$('#impM').value=m;updateImpPreview();toast('Szerkeszd, majd töltsd be újra');break}
    case 'impGo':{
      const [y,m]=getImpYM(),r=buildFromText(impText,y,m),key=y+'-'+pad(m);
      if(!r.emps.length)break;
      if(st.scheds[key]&&!arm('impGo',t,'Felülírod a hónapot? Koppints újra'))break;
      st.scheds[key]={emps:r.emps,events:(st.scheds[key]&&st.scheds[key].events)||{}};saveScheds();st.ym=key;st.sel=null;st.sub='team';store.set('sub','team');
      fillMeSel();loadTd();renderSchedule();updateBadges();toast(`Betöltve: ${r.emps.length} kolléga, ${y}. ${MON[m-1]}`);break}
    case 'resetSeed':{const ky=t.dataset.ym||'2026-10';if(arm('resetSeed'+ky,t,'Biztosan visszaállítod?')){st.scheds[ky]=seed()[ky];saveScheds();st.ym=ky;st.sel=null;fillMeSel();renderSchedule();updateBadges();toast('Október visszaállítva')}break}
    case 'photoPick':$('#photoFile').click();break;
    case 'photoView':photoModal();break;
    case 'photoRot':{const p=store.get('photo',null);if(!p)break;const i=new Image();i.onload=()=>{store.set('photo',imgToData(i,true));photoModal()};i.src=p;break}
    case 'photoDel':store.del('photo');closeModal();renderPane();toast('Fotó törölve');break;
    case 'rqType':setRqType(t.dataset.v);break;
    case 'rqFilt':st.rq.filt=t.dataset.v;renderReqList();break;
    case 'rqSend':sendReq(t);break;
    case 'rqToggle':{const c=t.closest('.rcard'),o=c.classList.toggle('open');st.rq.open[c.dataset.rid]=o;t.setAttribute('aria-expanded',String(o));break}
    case 'rqMsg':postMsg(t.dataset.id,t);break;
    case 'rqDecide':decideReq(t.dataset.id,t.dataset.s);break;
    case 'rqUndecide':undecideReq(t.dataset.id);break;
    case 'rqDel':if(arm('rqDel'+t.dataset.id,t,'Biztosan törlöd?'))delReq(t.dataset.id);break;
    case 'rqCopy':copyReq(t.dataset.id);break;
    case 'evEdit':openEv(+t.dataset.d);break;
    case 'evLvl':st.evLvl=t.dataset.v;$$('[data-act="evLvl"]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.evLvl));break;
    case 'evSave':saveEv();break;
    case 'evDel':delEv();break;
  }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='meSel'){onMeSelChange(t)}
  else if(t.id==='impFile'){await handleFile(t.files[0]);t.value=''}
  else if(t.id==='impM'||t.id==='impY'){updateImpPreview()}
  else if(t.id==='photoFile'){
    const f=t.files[0];t.value='';if(!f)return;
    try{const img=await readImage(f);if(!store.set('photo',imgToData(img,false)))toast('A fotó nem fér el a böngésző tárhelyén.');else{renderPane();toast('Fotó csatolva')}}
    catch(e){toast('A képet nem sikerült beolvasni.')}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.draft){st.rq.draft[t.dataset.draft]=t.value}
  else if(t.id==='repAr'){st.rep.draft.ar=t.value}
  else if(t.id==='repForgalom'){st.rep.draft.forgalom=t.value}
  else if(t.id==='tvpPrice'){st.tvp.price=t.value}
  else if(t.id==='impText'){impText=t.value;updateImpPreview()}
  else if(t.id==='edVal')updateEdPrev();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(ev.key==='Enter'&&ev.target.id==='edVal'){ev.preventDefault();saveEdit()}
  if(ev.key==='Enter'&&ev.target.dataset&&/^msg:/.test(ev.target.dataset.draft||'')){ev.preventDefault();const b=ev.target.parentNode.querySelector('[data-act="rqMsg"]');if(b)b.click()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.id==='drop'){ev.preventDefault();$('#impFile').click()}
  if(ev.key==='Enter'&&ev.target.id==='tvpPrice'){ev.preventDefault();const b=document.querySelector('[data-act="tvpCalc"]');if(b)b.click()}
  if(ev.key==='Enter'&&ev.target.id==='pinVal'){ev.preventDefault();const b=document.querySelector('[data-act="pinGo"]');if(b)b.click()}
  if(ev.key==='Enter'&&(ev.target.id==='repAr'||ev.target.id==='repForgalom')){ev.preventDefault();const b=document.querySelector('[data-act="repSend"]');if(b)b.click()}
});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.remove('over');handleFile(ev.dataTransfer.files[0])}});
window.addEventListener('resize',()=>{moveDock();moveSeg()});

/* ---------- clock loop ---------- */
function tick(){
  tickClock();
  if(st.tab==='schedule'&&st.sub==='mine'){tickToday()}
  if(st.tab==='todo'&&st.me){if(todayKey()!==st.tdKey)renderTodo();else syncTodo()}
  else if(st.me&&todayKey()!==st.tdKey){loadTd();updateBadges()}
  if(st.me&&todayKey()!==st.glKey){loadGl();if(st.tab==='goal')renderGoal()}
  if(st.tab==='req'&&st.rq.mode==='shared')scheduleReqRender();
  updateBadges();
}
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- cleanup old keys ---------- */
try{
  const lim=new Date();lim.setDate(lim.getDate()-45);const cut=dateKey(lim);
  Object.keys(localStorage).forEach(k=>{const m=k.match(/^bp1\.todo\.(\d{4}-\d{2}-\d{2})\./);if(m&&m[1]<cut)localStorage.removeItem(k)});
}catch(e){}

/* ---------- init ---------- */
(function(){
  let ch=false;
  if(!store.get('rmSept1',false)){
    if(st.scheds['2026-09']){delete st.scheds['2026-09'];ch=true}
    store.set('rmSept1',true);
  }
  if(!store.get('octSeed1',false)){
    if(!st.scheds['2026-10']){st.scheds['2026-10']=seed()['2026-10'];ch=true}
    store.set('octSeed1',true);
  }
  if(st.me&&allNames().indexOf(st.me)<0){st.me=null;store.del('me')}
  if(ch)saveScheds();
})();
$$('[data-ico]').forEach(s=>{s.outerHTML=ic(s.dataset.ico)});
if(st.me===MANAGER&&!isPinOk()){st.me=null;store.del('me')}
else if(st.me===MANAGER)askNotifyPermission();
fillMeSel();tickClock();loadTd();loadGl();setSeason();setTab(st.tab,true);updateBadges();galaxyInit();initHwCanvas('hwCanvasHero');
initDb();
window.addEventListener('load',()=>{moveDock();moveSeg()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{moveDock();moveSeg()});
})();
</script>
</body>
</html>
