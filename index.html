function monthBar(){
  const [y,m]=parseYm(st.ym);
  return `<div class="mbar"><button class="ib" data-act="mo" data-dir="-1" aria-label="Előző hónap">${ic('left')}</button><button class="mtitle" data-act="mpick" aria-haspopup="true"><span>${y}. ${MON[m-1]}</span>${ic('chev')}</button><button class="ib" data-act="mo" data-dir="1" aria-label="Következő hónap">${ic('right')}</button></div>`;
}
function monthPickerHTML(){
  const now=new Date(),base=new Date(now.getFullYear(),now.getMonth(),1);
  const keys=new Set(Object.keys(st.scheds));
  for(let i=-9;i<=15;i++){const d=new Date(base.getFullYear(),base.getMonth()+i,1);keys.add(ymKey(d))}
  const cur=ymKey(now);
  const rows=[...keys].sort().map(k=>{
    const [y,m]=parseYm(k),has=!!st.scheds[k],sel=k===st.ym,isNow=k===cur;
    return `<button class="mprow ${has?'has':''} ${sel?'sel':''} ${isNow?'now':''}" data-act="mgoto" data-k="${k}"><span class="dot"></span><span>${y}. ${MON[m-1]}</span>${isNow?'<small>ma</small>':''}</button>`;
  }).join('');
  return `<h3>Hónap váltása</h3><p class="muted" style="margin-top:4px">Görgesd a listát, és koppints a hónapra, ahová ugranál.</p><div class="mplist" id="mplist">${rows}</div>`;
}
function emptyMonthHTML(){
  const keys=Object.keys(st.scheds).sort();
  return monthBar()+`<div class="card reveal"><h3>Ehhez a hónaphoz még nincs beosztás</h3><p class="muted" style="margin-top:4px">Tölts fel egy táblázatot, vagy ugorj egy meglévő hónapra.</p>
  <div class="btns"><button class="btn primary" data-act="sub" data-sub="up">${ic('upload')}Feltöltés</button>${keys.map(k=>{const a=parseYm(k);return `<button class="btn" data-act="gotoYm" data-k="${k}">${a[0]}. ${MON[a[1]-1]}</button>`}).join('')}</div></div>`;
}
function mismatchHTML(list){
  const m2=list.filter(e=>e.sheet!=null&&Math.abs(e.sheet-hoursOf(e))>0.01);
  if(!m2.length)return '';
  return `<div class="callout reveal">A fotón szereplő órasszesítés eltér: ${m2.map(e=>`<b>${esc(e.name)}</b> (lapon ${e.sheet} ó, itt ${hoursOf(e)} ó)`).join(', ')}. A Csapat fülön a cellákra koppintva javíthatod, ha valami félreolvasódott.</div>`;
}

function todayInfo(emp){
  const now=new Date(),d=now.getDate(),c=parseCell(emp.cells[d-1]),h=now.getHours()+now.getMinutes()/60;
  const nextShift=()=>{
    for(let i=d+1;i<=emp.cells.length;i++){const p=parseCell(emp.cells[i-1]);if(p.t==='w'){
      const wd=new Date(now.getFullYear(),now.getMonth(),i).getDay();return `Következő műszakod: ${DAYN[wd]} ${i}., ${tf(p.s)}–${tf(p.e)}`}}
    return 'Több műszak nincs rögzítve ebben a hónapban.';
  };
  if(c.t==='w'){
    const range=tf(c.s)+' – '+tf(c.e);
    if(h<c.s)return {ic:'clock',tone:'',title:'Ma dolgozol',time:range,sub:'Kezdésig még '+dur(Math.round((c.s-h)*60)),pct:0};
    if(h<c.e)return {ic:'zap',tone:'mint',title:'Műszakban vagy',time:range,sub:'Hátra még '+dur(Math.round((c.e-h)*60)),pct:(h-c.s)/(c.e-c.s)*100};
    return {ic:'award',tone:'amber',title:'Mára végeztél',time:range,sub:'Szép munka! '+nextShift(),pct:100};
  }
  if(c.t==='p')return {ic:'sun',tone:'mint',title:'Ma pihenőnap',time:'Pihenj!',sub:nextShift(),pct:-1};
  if(c.t==='sz')return {ic:'sun',tone:'amber',title:'Ma szabadságon vagy',time:'Szabadság',sub:nextShift(),pct:-1};
  if(c.t==='b')return {ic:'heart',tone:'coral',title:'Ma betegszabadságon vagy',time:'Jobbulást!',sub:nextShift(),pct:-1};
  return {ic:'cal',tone:'grey',title:'Mára nincs beosztás rögzítve',time:'–',sub:'Ellenőrizd a Csapat fülön.',pct:-1};
}
function tickToday(){
  const emp=findMe();if(!emp||!$('#tcTime')||st.ym!==ymKey(new Date()))return;
  const i=todayInfo(emp);
  $('#tcLead').innerHTML=`<span class="ico ${i.tone}">${ic(i.ic)}</span>${esc(i.title)}`;
  $('#tcTime').textContent=i.time;$('#tcSub').textContent=i.sub;
  const bar=$('#tcBarWrap');
  if(i.pct<0){bar.hidden=true}else{bar.hidden=false;requestAnimationFrame(()=>{$('#tcBar').style.width=Math.max(2,i.pct)+'%'})}
  tickNow();
}
function animateMeter(){
  const m=$('#meter');if(m)requestAnimationFrame(()=>requestAnimationFrame(()=>{m.style.width=m.dataset.w+'%'}));
}
function stripHTML(){
  const now=new Date(),d=now.getDate();
  const rows=emps().map(e=>({e,c:parseCell(e.cells[d-1])})).filter(r=>r.c.t==='w').sort((a,b)=>a.c.s-b.c.s);
  if(!rows.length)return `<div class="card reveal"><h3>Ma a boltban</h3><p class="muted" style="margin-top:4px">Ma senkinek nincs műszakja rögzítve.</p></div>`;
  const lo=Math.floor(Math.min(9,...rows.map(r=>r.c.s))),hi=Math.ceil(Math.max(20,...rows.map(r=>r.c.e))),span=hi-lo;
  let ticks='';for(let h=lo;h<=hi;h+=(span>12?2:1)){ticks+=`<span style="left:${(h-lo)/span*100}%">${h%24}</span>`}
  const nowH=now.getHours()+now.getMinutes()/60;
  return `<div class="card tl reveal" data-lo="${lo}" data-hi="${hi}"><div class="ch" style="margin-bottom:8px"><span class="ico">${ic('users')}</span><div><h3>Ma a boltban</h3><p>${rows.length} fő dolgozik ma</p></div></div>
  <div class="tl-axis">${ticks}</div>
  ${rows.map((r,i)=>{
    const on=nowH>=r.c.s&&nowH<r.c.e,me=r.e.name===st.me;
    return `<div class="lane"><span class="ln ${on?'on':''}">${on?'<i class="dot"></i>':''}${esc(r.e.name.split(' ')[0])}</span>
    <div class="track" style="--hrs:${span}"><i class="seg ${me?'me':''}" style="left:${(r.c.s-lo)/span*100}%;width:${(r.c.e-r.c.s)/span*100}%;--d:${i*90}ms"></i><b class="now"></b></div></div>`}).join('')}
  </div>`;
}
function tickNow(){
  const tl=$('.tl');if(!tl)return;
  const lo=+tl.dataset.lo,hi=+tl.dataset.hi,n=new Date(),h=n.getHours()+n.getMinutes()/60;
  const pct=(h-lo)/(hi-lo)*100;
  $$('.now',tl).forEach(b=>{b.hidden=pct<0||pct>100;b.style.left=pct+'%'});
}
function mineHTML(){
  if(!st.me)return pickMeHTML();
  const sch=st.scheds[st.ym];
  if(!sch)return emptyMonthHTML();
  const emp=findMe();
  if(!emp)return monthBar()+`<div class="card reveal"><h3>Ebben a hónapban nem szerepelsz a beosztásban</h3><p class="muted" style="margin-top:4px">Válassz másik nevet, vagy nézd meg a Csapat fület.</p><div class="chips">${emps().map((e,i)=>`<button class="who-chip" data-act="pickMe" data-n="${esc(e.name)}" style="--i:${i}">${avatar(e.name)}${esc(e.name)}${roleTag(e.name)}</button>`).join('')}</div></div>`;
  const [y,m]=parseYm(st.ym),n=daysIn(y,m),isCur=st.ym===ymKey(new Date()),today=new Date().getDate();
  const hrs=hoursOf(emp),norm=normHours(y,m),bal=Math.round((hrs-norm)*100)/100,cn=countsOf(emp);
  if(st.sel==null||st.sel>n)st.sel=isCur?today:1;
  const off=(new Date(y,m-1,1).getDay()+6)%7;
  let cal=['H','K','Sze','Cs','P','Szo','V'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<off;i++)cal+=`<div class="day empty"></div>`;
  for(let d=1;d<=n;d++){
    const p=parseCell(emp.cells[d-1]),ev=evOf(st.ym,d);
    cal+=`<button class="day ${cls(p)}${evCls(st.ym,d)} ${isCur&&d===today?'today':''} ${d===st.sel?'sel':''}" data-act="sel" data-d="${d}" style="--i:${off+d}" aria-label="${d}. nap, ${esc(longLabel(p))}${ev?', '+esc(ev.title):''}">${evMark(st.ym,d)}<span class="n">${d}</span><span class="v">${label(p)}</span></button>`;
  }
  const info=isCur?todayInfo(emp):null;
  const slide=st.moDir>0?'s-r':st.moDir<0?'s-l':'';st.moDir=0;
  return upcomingHTML()+monthBar()+
  (isCur?`<div class="card today reveal"><div class="lead" id="tcLead"><span class="ico ${info.tone}">${ic(info.ic)}</span>${esc(info.title)}</div>
    <div class="big" id="tcTime">${esc(info.time)}</div>
    <div id="tcBarWrap" class="bar" ${info.pct<0?'hidden':''}><i id="tcBar" style="width:0"></i></div>
    <div class="sub" id="tcSub">${esc(info.sub)}</div></div>`+stripHTML():'')+
  mismatchHTML([emp])+
  `<div class="card reveal"><div class="ledger"><div class="num"><span data-count="${hrs}">0</span><small>óra</small></div><span class="bal ${bal>=0?'pos':'neg'}"><span data-count="${bal}" data-sign="1">0</span> a ${norm} órás normához</span></div>
    <div class="meter"><i id="meter" data-w="${Math.min(100,Math.round(hrs/norm*100))}"></i></div>
    <div class="facts"><span><b>${cn.w}</b> műszak</span><span><b>${cn.p}</b> pihenőnap</span>${cn.sz?`<span><b>${cn.sz}</b> szabadság</span>`:''}${cn.b?`<span><b>${cn.b}</b> beteg</span>`:''}<span>${norm/8} munkanap / ${norm} óra</span></div></div>`+
  `<div class="card reveal"><div class="cal ${slide}">${cal}</div>
    <div class="legend"><span><i class="i-w"></i>Műszak</span><span><i class="i-p"></i>Pihenő (P)</span><span><i class="i-sz"></i>Szabadság (SZ)</span><span><i class="i-b"></i>Beteg (B)</span><span><i class="i-n"></i>Nincs adat</span></div></div>`+
  `<div class="card reveal" id="dayDetail">${dayDetailInner(st.sel)}</div>`;
}
function dayDetailInner(d){
  const [y,m]=parseYm(st.ym),wd=new Date(y,m-1,d).getDay();
  const rows=emps().map(e=>({e,c:parseCell(e.cells[d-1])}));
  rows.sort((a,b)=>(a.c.t==='w'?0:1)-(b.c.t==='w'?0:1)||(a.c.s||0)-(b.c.s||0));
  const wk=rows.filter(r=>r.c.t==='w').length,ev=evOf(st.ym,d);
  const banner=ev?`<div class="evbanner ${ev.lvl}"><span class="evi">${evIcon(ev)}</span><div><b>${esc(ev.title)}</b><small>${esc(ev.note)}</small></div></div>`:'';
  return `<h3>${MON[m-1]} ${d}., ${DAYN[wd]}</h3><p class="muted" style="font-size:13.5px">${wk} fő dolgozik ezen a napon</p>${banner}
  <ul class="dlist">${rows.map((r,i)=>`<li class="${r.e.name===st.me?'me':''}" style="--k:${i}">${avatar(r.e.name)}<span class="nm">${esc(r.e.name)}</span><span class="tag ${cls(r.c)}">${esc(longLabel(r.c))}</span></li>`).join('')}</ul><button class="btn" data-act="evEdit" data-d="${d}" style="margin-top:14px">${ev?'Esemény szerkesztése':'Esemény hozzáadása'}</button>`;
}
function selectDay(d){
  st.sel=d;
  $$('.day[data-d]').forEach(b=>b.classList.toggle('sel',+b.dataset.d===d));
  const det=$('#dayDetail');det.innerHTML=dayDetailInner(d);det.classList.remove('flip');void det.offsetWidth;det.classList.add('flip');
}

/* ---------- Csapat ---------- */
function teamHTML(){
  const sch=st.scheds[st.ym];
  if(!sch)return emptyMonthHTML();
  const [y,m]=parseYm(st.ym),n=daysIn(y,m),isCur=st.ym===ymKey(new Date()),today=new Date().getDate();
  let head=`<tr><th class="nm">${MON[m-1]}</th>`;

/* ---------- Feltöltés ---------- */
function parseDelimited(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const delim=first.indexOf('\t')>=0?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
function buildFromText(text,y,m){
  const n=daysIn(y,m),out={emps:[],warn:[]};
  if(!text.trim())return out;
  const rows=parseDelimited(text);
  let hi=-1,map=null;
  for(let i=0;i<rows.length;i++){
    const cols=[];
    rows[i].forEach((c,j)=>{const t=String(c).trim();if(j>0&&/^\d{1,2}$/.test(t)&&+t>=1&&+t<=31)cols.push([j,+t])});
    if(cols.length>=5){hi=i;map=cols;break}
  }
  if(!map){map=[];for(let j=1;j<=n;j++)map.push([j,j])}
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i],name=String(r[0]||'').trim();
    if(!name||/^(név|nev|name)$/i.test(name)||/^\d+$/.test(name))continue;
    const cells=Array(n).fill('');
    map.forEach(([j,d])=>{
      if(d>n)return;
      const raw=r[j]==null?'':String(r[j]),p=parseCell(raw);
      if(p.t==='?'){out.warn.push(`${name}, ${d}. nap: „${raw.trim()}” nem értelmezhető`);return}
      cells[d-1]=canon(p);
    });
    out.emps.push({name,cells});
  }
  return out;
}
function toText(key){
  const [y,m]=parseYm(key),n=daysIn(y,m),s=st.scheds[key],head=['Név'];
  for(let d=1;d<=n;d++)head.push(d);
  const lines=[head.join('\t')];
  (s?s.emps:[]).forEach(e=>{const r=[e.name];for(let d=0;d<n;d++)r.push(excelTxt(parseCell(e.cells[d])));lines.push(r.join('\t'))});
  return lines.join('\n');
}

function imgToData(img,rot){
  let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,1800/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas'),x=c.getContext('2d');
  if(rot){c.width=h;c.height=w;x.translate(h,0);x.rotate(Math.PI/2);x.drawImage(img,0,0,w,h)}else{c.width=w;c.height=h;x.drawImage(img,0,0,w,h)}
  return c.toDataURL('image/jpeg',.82);
}

async function repSave(btn){
  const fEl=$('#repF'),bEl=$('#repB');
  if(!fEl||!bEl)return;
  const fRaw=(fEl.value||'').replace(/[^\d]/g,'');
  const bNum=parseFloat((bEl.value||'').replace(',','.').replace(/[^\d.]/g,''));
  if(!fRaw||isNaN(bNum)){toast('Add meg mindkét értéket.');return}
  const doc={by:st.me,date:todayKey(),kind:'close',idx:0,label:'Zárás',forgalom:parseInt(fRaw,10),beterok:Math.round(Math.max(0,Math.min(100,bNum))*10)/10,at:Date.now()};
  const id=repId(doc.by,doc.date);
  btn.disabled=true;
  st.rep.list=(st.rep.list||[]).filter(r=>!(r.by===doc.by&&r.date===doc.date&&r.kind==='close')).concat([Object.assign({id},doc)]);
  let ok=false;
  if(st.rep.db){try{await st.rep.db.doc('reports/'+id).set(doc);ok=true}catch(e){}}
  st.rep.outbox=(st.rep.outbox||[]).filter(x=>x.id!==id);
  if(!ok)st.rep.outbox.push({id,doc});
  store.set('rep.outbox',st.rep.outbox);
  st.rep.open=false;st.rep.draft={};
  const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);haptic(10);
  toast(ok?'Leadva, '+MANAGER+' látja':'Nincs net: elmentve, automatikusan elküldöm');
  renderDaily();
}
const MONS=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
const fmtWhen=ms=>{const d=new Date(ms);return MONS[d.getMonth()]+' '+d.getDate()+'. '+pad(d.getHours())+':'+pad(d.getMinutes())};
function errMsg(e){
  const c=e&&e.code;
  return c==='quota_exceeded'?'Betelt a tárhely, szólj az üzletvezetőnek.':
    c==='invalid_argument'?'Ehhez most nincs írási jogosultságod.':
    c==='resource_exhausted'?'Túl gyorsan mentél, próbáld újra egy pillanat múlva.':
    c==='revoked'?'A hozzáférésed megszűnt, töltsd újra az oldalt.':'Nem sikerült, próbáld újra.';
}

const SHEET_URL='https://script.google.com/macros/s/AKfycby5rtgK_1HvQC7xM0syvqUAQa4w5mwiaWxs26BiGyEJThUFtuS4PYORVVKgMHZPvFDw/exec';
function makeSheetDb(base,hooks){
  hooks=hooks||{};
  const watchers={};
  const lastJson={};
  let timer=null,inFlight=false,visible=(typeof document==='undefined'||!document.hidden);
  function snap(docs){return {docs:(docs||[]).map(d=>({id:d.id,data:()=>d.data}))}}
  async function post(body){
    const res=await fetch(base,{method:'POST',body:JSON.stringify(body)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    scheduleNow();
    return j;
  }
  async function pollAll(){
    if(inFlight||!Object.keys(watchers).length)return;
    inFlight=true;
    try{
      const res=await fetch(base+'?all=1&t='+Date.now());
      if(!res.ok)throw new Error('HTTP '+res.status);
      const j=await res.json();
      let cols=j.collections;
      if(!cols){
        cols={};
        for(const name of Object.keys(watchers)){
          const r2=await fetch(base+'?collection='+encodeURIComponent(name)+'&t='+Date.now());
          if(!r2.ok)throw new Error('HTTP '+r2.status);
          const j2=await r2.json();cols[name]=j2.docs||[];
        }
      }
      Object.keys(watchers).forEach(name=>{
        const docs=cols[name]||[];
        const js=JSON.stringify(docs);
        if(js!==lastJson[name]){lastJson[name]=js;watchers[name].next(snap(docs))}
      });
      if(hooks.ok)hooks.ok();
    }catch(e){
      if(hooks.err)hooks.err(e&&e.message?e.message:String(e));
    }finally{inFlight=false}
  }
  function loop(){
    clearTimeout(timer);
    if(visible){pollAll().finally(()=>{timer=setTimeout(loop,25000)})}
    else timer=setTimeout(loop,25000);
  }
  function scheduleNow(){clearTimeout(timer);timer=setTimeout(loop,300)}
  if(typeof document!=='undefined'){
    document.addEventListener('visibilitychange',()=>{
      visible=!document.hidden;
      if(visible)scheduleNow();
    });
  }
  function docRef(c,id){
    return {
      id,
      async set(data){await post({collection:c,id,data})},
      async delete(){await post({collection:c,id,action:'delete'})}
    };
  }
  function collection(c){
    return {
      onSnapshot(next,err){
        watchers[c]={next,err};
        if(!timer)loop();else scheduleNow();
        return ()=>{delete watchers[c]};
      },
      async add(data){const r=await post({collection:c,data});return {id:r.id}},
      doc(id){return docRef(c,id)}
    };
  }
  function doc(path){const i=path.indexOf('/');return docRef(path.slice(0,i),path.slice(i+1))}
  return {collection,doc,refresh:scheduleNow};
}
async function initDb(){
  if(!SHEET_URL)return;
  try{
    const db=makeSheetDb(SHEET_URL,{
      ok:()=>{st.rep.lastOk=Date.now();st.rep.lastErr='';flushOutbox();updateRepMeta();if(!st.rep.synced){st.rep.synced=true;scheduleCloseReminder(3000)}},
      err:m=>{st.rep.lastErr=String(m).slice(0,60);updateRepMeta()}
    });
    st.rep.db=db;
    db.collection('reports').onSnapshot(s=>{
      const docs=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(st.rep.seen===null){st.rep.seen=new Set(docs.map(d=>d.id))}
      else{
        const fresh=docs.filter(d=>!st.rep.seen.has(d.id));
        fresh.forEach(d=>st.rep.seen.add(d.id));
        if(st.me===MANAGER)fresh.forEach(d=>{if(d.kind==='close'&&d.by!==MANAGER){const m=d.by+' \u2014 '+ft(d.forgalom)+', AR '+d.beterok+'%';toast('Új zárás-jelentés: '+m);haptic([16,40,16]);notifyMgr('Zárás-jelentés',m)}});
      }
      st.rep.list=repMerge(docs);afterRepData();
    },()=>{});
  }catch(e){}
}

/* ================= events ================= */
document.addEventListener('pointerdown',ev=>{
  const t=ev.target.closest('.btn,.task,.slot,.seg-ctl button,.qchips button,.who-chip,.fchip,.goalbtn,.bmain,.stepper button,.ib,.tchip,.rhead');
  if(!t||t.disabled||reduced())return;
  const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2;
  const i=document.createElement('span');i.className='rip';
  i.style.cssText=`width:${s}px;height:${s}px;left:${ev.clientX-r.left-s/2}px;top:${ev.clientY-r.top-s/2}px`;
  t.appendChild(i);setTimeout(()=>i.remove(),700);
});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(ev.target.id==='modal'){closeModal();return}
  if(!t)return;
  const a=t.dataset.act;
  switch(a){
    case 'tab':setTab(t.dataset.tab);break;
    case 'sub':st.sub=t.dataset.sub;store.set('sub',st.sub);if(st.tab!=='schedule')setTab('schedule');else renderPane();break;
    case 'mo':{const dir=+t.dataset.dir,[y,m]=parseYm(st.ym),d=new Date(y,m-1+dir,1);st.ym=ymKey(d);st.sel=null;st.moDir=dir;renderPane();break}
    case 'gotoYm':st.ym=t.dataset.k;st.sel=null;renderPane();break;
    case 'mpick':openModal(monthPickerHTML());setTimeout(()=>{const el=document.querySelector('.mprow.sel');if(el)el.scrollIntoView({block:'center'})},60);break;
    case 'mgoto':st.ym=t.dataset.k;st.sel=null;closeModal();renderPane();break;
    case 'sel':selectDay(+t.dataset.d);break;
    case 'pinGo':pinSubmit(t.dataset.n);break;
    case 'pickMe':trySelectPerson(t.dataset.n);break;
    case 'edit':openEdit(+t.dataset.e,+t.dataset.d);break;
    case 'chip':{const i=$('#edVal');i.value=t.dataset.v;updateEdPrev();break}
    case 'edSave':saveEdit();break;
    case 'modalClose':closeModal();break;
    case 'repOpen':st.rep.open=!st.rep.open;renderDaily();setTimeout(()=>{const i=$('#repF');if(i)i.focus()},60);break;
    case 'repSave':repSave(t);break;
    case 'goReport':closeModal();setTab('daily');setTimeout(()=>{const i=$('#repF');if(i)i.focus()},450);break;
    case 'repRefresh':if(st.rep.db){st.rep.db.refresh();toast('Frissítés…')}else toast('Nincs kapcsolat a táblázattal');break;
    case 'repFlush':flushOutbox().then(()=>{afterRepData();toast((st.rep.outbox||[]).length?'Még nem sikerült elküldeni':'Elküldve')});break;
    case 'openFile':$('#impFile').click();break;
    case 'impCur':{impText=toText(st.ym);$('#impText').value=impText;const [y,m]=parseYm(st.ym);$('#impY').value=y;$('#impM').value=m;updateImpPreview();toast('Szerkeszd, majd töltsd be újra');break}
    case 'impGo':{
      const [y,m]=getImpYM(),r=buildFromText(impText,y,m),key=y+'-'+pad(m);
      if(!r.emps.length)break;
      if(st.scheds[key]&&!arm('impGo',t,'Felülírod a hónapot? Koppints újra'))break;
      st.scheds[key]={emps:r.emps,events:(st.scheds[key]&&st.scheds[key].events)||{}};saveScheds();st.ym=key;st.sel=null;st.sub='team';store.set('sub','team');
      fillMeSel();renderSchedule();updateBadges();toast(`Betöltve: ${r.emps.length} kolléga, ${y}. ${MON[m-1]}`);break}
    case 'resetSeed':{const ky=t.dataset.ym||'2026-11';if(arm('resetSeed'+ky,t,'Biztosan visszaállítod?')){st.scheds[ky]=seed()[ky];saveScheds();st.ym=ky;st.sel=null;fillMeSel();renderSchedule();updateBadges();toast('November visszaállítva')}break}
    case 'photoPick':$('#photoFile').click();break;
    case 'photoView':photoModal();break;
    case 'photoRot':{const p=store.get('photo',null);if(!p)break;const i=new Image();i.onload=()=>{store.set('photo',imgToData(i,true));photoModal()};i.src=p;break}
    case 'photoDel':store.del('photo');closeModal();renderPane();toast('Fotó törölve');break;
    case 'evEdit':openEv(+t.dataset.d);break;
    case 'evLvl':st.evLvl=t.dataset.v;$$('[data-act="evLvl"]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.evLvl));break;
    case 'evSave':saveEv();break;
    case 'evDel':delEv();break;
  }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='meSel'){onMeSelChange(t)}
  else if(t.id==='impFile'){await handleFile(t.files[0]);t.value=''}
  else if(t.id==='impM'||t.id==='impY'){updateImpPreview()}
  else if(t.id==='photoFile'){
    const f=t.files[0];t.value='';if(!f)return;
    try{const img=await readImage(f);if(!store.set('photo',imgToData(img,false)))toast('A fotó nem fér el a böngésző tárhelyén.');else{renderPane();toast('Fotó csatolva')}}
    catch(e){toast('A képet nem sikerült beolvasni.')}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='repF'||t.id==='repB'){st.rep.draft[t.id==='repF'?'f':'b']=t.value}
  else if(t.id==='impText'){impText=t.value;updateImpPreview()}
  else if(t.id==='edVal')updateEdPrev();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(ev.key==='Enter'&&ev.target.id==='edVal'){ev.preventDefault();saveEdit()}
  if(ev.key==='Enter'&&ev.target.dataset&&/^msg:/.test(ev.target.dataset.draft||'')){ev.preventDefault();const b=ev.target.parentNode.querySelector('[data-act="rqMsg"]');if(b)b.click()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.id==='drop'){ev.preventDefault();$('#impFile').click()}
  if(ev.key==='Enter'&&ev.target.id==='pinVal'){ev.preventDefault();const b=document.querySelector('[data-act="pinGo"]');if(b)b.click()}
  if(ev.key==='Enter'&&ev.target.id==='repF'){ev.preventDefault();const i=$('#repB');if(i)i.focus()}
  if(ev.key==='Enter'&&ev.target.id==='repB'){ev.preventDefault();const bt=document.querySelector('[data-act="repSave"]');if(bt)bt.click()}
});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.remove('over');handleFile(ev.dataTransfer.files[0])}});
window.addEventListener('resize',()=>{moveDock();moveSeg()});

/* ---------- clock loop ---------- */
function tick(){
  tickClock();
  if(st.tab==='schedule'&&st.sub==='mine'){tickToday()}
  if(st.tab==='daily'&&st.me&&!st.rep.open&&!repTyping())renderDaily();
  flushOutbox();
  checkNearClose();
  updateBadges();
}
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- cleanup old keys ---------- */
try{
  const lim=new Date();lim.setDate(lim.getDate()-45);const cut=dateKey(lim);
  Object.keys(localStorage).forEach(k=>{const m=k.match(/^bp1\.todo\.(\d{4}-\d{2}-\d{2})\./);if(m&&m[1]<cut)localStorage.removeItem(k)});
}catch(e){}

/* ---------- init ---------- */
(function(){
  let ch=false;
  if(!store.get('rmSept1',false)){
    if(st.scheds['2026-09']){delete st.scheds['2026-09'];ch=true}
    store.set('rmSept1',true);
  }
  if(!store.get('novSeed1',false)){
    if(st.scheds['2026-10']){delete st.scheds['2026-10'];ch=true}
    st.scheds['2026-11']=seed()['2026-11'];ch=true;
    store.set('novSeed1',true);
  }
  if(!st.scheds[st.ym]){const ks=Object.keys(st.scheds).sort();if(ks.length)st.ym=ks[ks.length-1]}
  if(st.me&&allNames().indexOf(st.me)<0){st.me=null;store.del('me')}
  if(ch)saveScheds();
})();
$$('[data-ico]').forEach(s=>{s.outerHTML=ic(s.dataset.ico)});
if(st.me===MANAGER&&!isPinOk()){st.me=null;store.del('me')}
else if(st.me===MANAGER)askNotifyPermission();
fillMeSel();tickClock();setSeason();setTab(st.tab,true);updateBadges();galaxyInit();initSnow('snowHero',40);initSnow('snowSplash',70);
initDb();
scheduleCloseReminder(6500);
window.addEventListener('load',()=>{moveDock();moveSeg()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{moveDock();moveSeg()});
})();
</script>
